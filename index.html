<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кнопка</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #87CEEB;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Контейнер для видео сверху */
        #video-box {
            width: 70vmin;
            height: 35vmin;
            margin-bottom: 3vmin;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            border-radius: 2vmin;
            overflow: hidden;
            opacity: 0;                 /* спрятано, пока не нажали */
            transition: opacity 0.15s;
        }
        #video-box.show {
            opacity: 1;
        }

        #drop-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #big-button {
            width: 50vmin;
            height: 50vmin;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #ff5a5a, #b30000 70%);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4),
                        inset 0 -8px 15px rgba(0,0,0,0.3),
                        inset 0 8px 15px rgba(255,255,255,0.25);
            border: none;
            cursor: pointer;
            transition: transform 0.1s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        #big-button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="video-box">
        <video id="drop-video" src="40a35162f937422ed569bd26a7f16507.mp4" muted playsinline preload="auto"></video>
    </div>

    <button id="big-button"></button>

    <script>
        const btn = document.getElementById('big-button');
        const videoBox = document.getElementById('video-box');
        const video = document.getElementById('drop-video');

        // --- АУДИО ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();

        const masterGain = ctx.createGain();
        masterGain.gain.value = 8;   // твоё усиление, оставил как есть
        masterGain.connect(ctx.destination);

        let audioBuffer = null;

        fetch('sound.mp3')
            .then(res => res.arrayBuffer())
            .then(data => ctx.decodeAudioData(data))
            .then(buffer => { audioBuffer = buffer; })
            .catch(err => console.error('Ошибка загрузки звука:', err));

        function playSound() {
            if (!audioBuffer) return;
            const source = ctx.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(masterGain);
            source.start(0);
        }

        // --- ВИДЕО ---
        let hideTimer = null;

        function playVideo() {
            videoBox.classList.add('show');
            video.currentTime = 0;
            video.play().catch(() => {});

            // Прячем видео, когда оно закончится
            clearTimeout(hideTimer);
            hideTimer = setTimeout(() => {
                videoBox.classList.remove('show');
            }, 6100); // 3 сек — подгони под длину твоего видео
        }

        // --- КЛИК ---
        btn.addEventListener('click', () => {
            if (ctx.state === 'suspended') ctx.resume();
            playSound();
            playVideo();
        });
    </script>

</body>
</html>
