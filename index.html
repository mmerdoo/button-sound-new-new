<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кнопка</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #87CEEB;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .button-wrapper {
            /* Масштаб кнопки. Увеличь, если нужно больше. */
            transform: scale(2.2);
            -webkit-transform: scale(2.2);
            transform-origin: center center;
            -webkit-transform-origin: center center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        iframe {
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="button-wrapper">
        <iframe 
            src="https://www.myinstants.com/instant/tvoi-vysokii-shans-na-bolshoi-drop-musor-drop-41067/embed/"
            width="110"
            height="200"
            scrolling="no"
            frameborder="0">
        </iframe>
    </div>

</body>
</html>
