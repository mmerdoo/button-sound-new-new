<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кнопка</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #87CEEB;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #big-button {
            width: 60vmin;
            height: 60vmin;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #ff5a5a, #b30000 70%);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4), inset 0 -8px 15px rgba(0,0,0,0.3), inset 0 8px 15px rgba(255,255,255,0.25);
            border: none;
            cursor: pointer;
            transition: transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        #big-button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <button id="big-button"></button>
    <audio id="sound" src="sound.mp3" preload="auto"></audio>

    <script>
        const btn = document.getElementById('big-button');
        const audio = document.getElementById('sound');
        btn.addEventListener('click', () => {
            audio.currentTime = 0;
            audio.play();
        });
    </script>

</body>
</html>
